[package]
name = "rust_processor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
aws-config = "1.5"
aws-sdk-s3 = "1.38"
aws-sdk-xray = "1.53"
aws_lambda_events = { version = "0.15", features = ["sqs"] }
lambda_runtime = "0.13"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", features = ["jpeg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
